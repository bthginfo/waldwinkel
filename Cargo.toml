[package]
name = "waldwinkel"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bevy = { version = "=0.16.1", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_log",
    "android-native-activity", "bevy_asset", "bevy_color", "bevy_gltf",
    "bevy_pbr", "bevy_render", "bevy_scene", "bevy_sprite", "bevy_text",
    "bevy_ui", "bevy_window", "bevy_winit", "png", "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.6"

[profile.release]
opt-level = 2
strip = "debuginfo"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1
